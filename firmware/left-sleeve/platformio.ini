
#include <Wire.h>
#include <Adafruit_MPU6050.h>
#include <Adafruit_Sensor.h>
#include <Adafruit_GFX.h>
#include <Adafruit_SSD1306.h>
#include <math.h>

#define SCREEN_WIDTH 128
#define SCREEN_HEIGHT 64
#define OLED_RESET -1
#define OLED_ADDRESS 0x3C

Adafruit_SSD1306 display(
  SCREEN_WIDTH, SCREEN_HEIGHT, &Wire, OLED_RESET
);

Adafruit_MPU6050 mpu;

// Filter variables
float roll = 0.0;
float pitch = 0.0;

float alpha = 0.98;

// Gyroscope bias
float biasX = 0.0;
float biasY = 0.0;
float biasZ = 0.0;

unsigned long previousTime = 0;


void calibrateGyroscope(){

  const int samples = 200;

  float sumX = 0.0;
  float sumY = 0.0;
  float sumZ = 0.0;

  Serial.println("Keep MPU6050 stationary...");
  delay(1000);
  for (int i = 0; i < samples; i++) {
    sensors_event_t a, g, temp;
    mpu.getEvent(&a, &g, &temp);

    sumX += g.gyro.x;
    sumY += g.gyro.y;
    sumZ += g.gyro.z;

    delay(10);
  }
  biasX = sumX / samples;
  biasY = sumY / samples;
  biasZ = sumZ / samples; 
}



void setup() {
  Serial.begin(115200);

  Wire.begin(41, 42);

  if (!mpu.begin()) {
    Serial.println("MPU6050 not found!");
    while (1) delay(10);
  }

  if (!display.begin(
        SSD1306_SWITCHCAPVCC,
        OLED_ADDRESS
      )) {
    Serial.println("OLED not found!");
    while (1) delay(10);
  }
  calibrateGyroscope();

  // Set sensor ranges
  mpu.setAccelerometerRange(MPU6050_RANGE_8_G);
  mpu.setGyroRange(MPU6050_RANGE_500_DEG);
  mpu.setFilterBandwidth(MPU6050_BAND_21_HZ);

  // Initialize timing
  previousTime = micros();

  display.clearDisplay();
  display.setTextColor(SSD1306_WHITE);
  display.setTextSize(1);
  display.setCursor(0, 0);
  display.println("ATHERIS IMU");
  display.println("FILTER INITIALIZED");
  display.display();

  delay(1000);
}

void loop() {

  sensors_event_t a, g, temp;
  mpu.getEvent(&a, &g, &temp);

  // Calculate elapsed time
  unsigned long currentTime = micros();

  float dt = (currentTime - previousTime) / 1000000.0;

  previousTime = currentTime;

  // Accelerometer measurements
  float ax = a.acceleration.x;
  float ay = a.acceleration.y;
  float az = a.acceleration.z;

  // Accelerometer-based angles
  float accelRoll = atan2(ay, az) * 180.0 / PI;

  float accelPitch = atan2(
    -ax,
    sqrt(ay * ay + az * az)
  ) * 180.0 / PI;

  // Gyroscope angular velocity
  float gyroX = (g.gyro.x - biasX) * 180.0 / PI;
  float gyroY = (g.gyro.y - biasY) * 180.0 / PI;
  float gyroZ = (g.gyro.z - biasZ) * 180.0 / PI;

  // Complementary filter
  roll = alpha * (roll + gyroX * dt)
       + (1.0 - alpha) * accelRoll;

  pitch = alpha * (pitch + gyroY * dt)
        + (1.0 - alpha) * accelPitch;

  // OLED display
  display.clearDisplay();
  display.setCursor(0, 0);

  display.println("ATHERIS | IMU");
  display.println("--------------------");

  display.print("ACC R: ");
  display.println(accelRoll, 1);

  display.print("ACC P: ");
  display.println(accelPitch, 1);

  display.println("--------------------");

  display.print("FIL R: ");
  display.println(roll, 1);

  display.print("FIL P: ");
  display.println(pitch, 1);

  display.display();

  // Serial output
  Serial.print("Accelerometer Roll: ");
  Serial.print(accelRoll);

  Serial.print(" | Filtered Roll: ");
  Serial.println(roll);

  delay(20);
}
